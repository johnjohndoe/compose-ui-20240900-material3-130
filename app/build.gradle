plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "org.jetbrains.kotlin.plugin.compose"
    id "io.github.takahirom.roborazzi"
}

roborazzi {
    outputDir.set(file("src/test/screenshots"))
}

android {
    namespace "com.example.app"
    compileSdk rootProject.ext.android_compile_sdk_version

    defaultConfig {
        applicationId "com.example.app"
        minSdk rootProject.ext.android_min_sdk_version
        targetSdk rootProject.ext.android_target_sdk_version
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    buildFeatures {
        compose true
        viewBinding true
    }

    testOptions {
        unitTests {
            includeAndroidResources true
        }
    }

    lint {
        abortOnError true
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$rootProject.appcompat_version"
    implementation "com.bluelinelabs:conductor:$rootProject.conductor_version"

    def composeBom = platform("androidx.compose:compose-bom:$rootProject.compose_bom_version")
    implementation composeBom
    debugImplementation composeBom
    androidTestImplementation composeBom
    implementation "androidx.compose.material:material"
    implementation "androidx.compose.material3:material3:$rootProject.material3_version"
    implementation "androidx.compose.material:material-icons-extended"
    implementation "androidx.activity:activity-compose:1.10.1"
    implementation "androidx.compose.ui:ui-tooling-preview"
    debugImplementation "androidx.compose.ui:ui-tooling"
    debugImplementation "androidx.compose.ui:ui-test-manifest"

    testImplementation "junit:junit:4.13.2"
    testImplementation "androidx.test.ext:junit:1.2.1"
    testImplementation "org.robolectric:robolectric:4.16.1"
    testImplementation "org.robolectric:shadows-framework:4.16.1"
    testImplementation "io.github.takahirom.roborazzi:roborazzi:$rootProject.roborazzi_version"
    testImplementation "androidx.compose.ui:ui-test-junit4"
    testImplementation composeBom
}
